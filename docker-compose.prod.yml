# Весь стек в контейнерах: база, бэкенд и веб-сервер.
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: rental-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт наружу не открываем: база доступна только контейнерам этого стека

  backend:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 0 * * *} # UTC: 00:00 UTC = 03:00 по Москве
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_NOTIFY_SUCCESS: ${BACKUP_NOTIFY_SUCCESS:-false}
      ALERT_BOT_TOKEN: ${ALERT_BOT_TOKEN:-}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID:-}
    volumes:
      # Папка на другом диске, например D:/Backups/kovsh. Копии лежат вне Docker:
      # их не сотрёт даже docker compose down -v
      - ${BACKUP_DIR:-./backups}:/backups
      - media:/media # на запись: нужно при восстановлении фото
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data: # здесь Caddy хранит HTTPS-сертификаты
  caddy_config:
